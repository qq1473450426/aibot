<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦幻西游 AI 多账号主控板</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="page"><h1>梦幻西游 AI 多账号主控板</h1><div id="mode"></div><div id="accounts"></div><h2>实时日志</h2><pre id="logs"></pre></div><script>async function post(u,b={}){await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});refresh()}async function refresh(){let s=await fetch('/api/status').then(r=>r.json()),l=await fetch('/api/logs?limit=100').then(r=>r.json());document.getElementById('mode').textContent=s.dry_run?'DRY-RUN 测试模式':'实际执行模式';document.getElementById('accounts').innerHTML=s.workers.map(w=>`<div class="worker"><b>${w.account_id} · ${w.name}</b> <span>${w.state}</span> <small>HWND=${w.hwnd||'-'} 任务=${w.task_name}</small><button onclick="post('/api/account/${w.account_id}/start')">启动</button><button onclick="post('/api/account/${w.account_id}/stop')">停止</button><button onclick="post('/api/account/${w.account_id}/task',{task_name:'test_task'})">测试任务</button><button onclick="post('/api/account/${w.account_id}/screenshot')">截图</button><button onclick="post('/api/account/${w.account_id}/simulate-disconnect')">模拟掉线</button></div>`).join('');document.getElementById('logs').textContent=l.map(x=>`${new Date(x.ts*1000).toLocaleString()} | ${x.level} | ${x.account_id||'SYSTEM'} | ${x.event} | ${x.message}`).join('\n')}setInterval(refresh,1500);refresh()</script></body></html>
